[package]
name = "hapmeth"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Per-haplotype 5mC locus plots (PNG/SVG) from haplotagged long-read modBAMs, with built-in imprinting / X-inactivation / QC panels for hg38 and hs1"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
noodles = { version = "0.116", features = ["bam", "bgzf", "core", "cram", "csi", "fasta", "sam"] }
rayon = "1.10"
resvg = { version = "0.48", default-features = false, features = ["text"] }

[profile.release]
lto = "thin"
codegen-units = 4
