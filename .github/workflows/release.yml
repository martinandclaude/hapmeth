# Builds release binaries. On a v* tag they are attached to a GitHub release;
# a manual run (workflow_dispatch) only builds them, as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (static)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --release --locked --target "$TARGET"
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          d=hapmeth-linux-x86_64
          mkdir "$d"
          cp "target/$TARGET/release/hapmeth" README.md LICENSE assets/fonts/LICENSE_DEJAVU.txt "$d/"
          file "$d/hapmeth"
          "$d/hapmeth" --version
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: hapmeth-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: |
          d=hapmeth-macos-universal
          mkdir "$d"
          lipo -create -output "$d/hapmeth" \
            target/aarch64-apple-darwin/release/hapmeth \
            target/x86_64-apple-darwin/release/hapmeth
          lipo -info "$d/hapmeth"
          "$d/hapmeth" --version
          arch -x86_64 "$d/hapmeth" --version || echo "x86_64 slice not run (no Rosetta on this runner)"
          cp README.md LICENSE assets/fonts/LICENSE_DEJAVU.txt "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: hapmeth-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "hapmeth $GITHUB_REF_NAME"
          --generate-notes
